services:
  db:
    image: postgres:17
    container_name: documind_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind_user
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -u documind_user -d documind"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: